<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Касса клуба</title>
  <meta name="description" content="Доходы и расходы спортивного клуба и личные траты">
  <meta name="theme-color" content="#E4DFD6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161B20" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Касса">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Вход -->
  <section id="login" class="login" hidden>
    <div class="login-box">
      <div class="login-mark" aria-hidden="true"></div>
      <h1 class="login-title">Касса клуба</h1>
      <p class="login-sub">Клубные деньги — для всех участников. Личные — только для тебя.</p>
      <form id="login-form" novalidate>
        <label class="field">
          <span>Имя</span>
          <input id="l-name" name="name" autocomplete="username" autocapitalize="words" required>
        </label>
        <label class="field">
          <span>PIN — 6 цифр</span>
          <input id="l-pin" name="pin" type="password" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="current-password" required>
        </label>
        <p id="l-error" class="form-error" role="alert"></p>
        <button class="btn primary big" type="submit" id="l-submit">Войти</button>
      </form>
      <p class="login-hint">PIN выдаёт админ клуба. Забыл PIN — попроси админа сбросить.</p>
    </div>
  </section>

  <!-- Приложение -->
  <div id="app" class="app" hidden>
    <header class="top">
      <div class="top-row">
        <span class="brand">Касса клуба</span>
        <button id="status" class="status" data-act="flush" type="button"></button>
      </div>
      <div class="seg" role="tablist" aria-label="Раздел">
        <button type="button" role="tab" data-act="section" data-v="club">Клуб</button>
        <button type="button" role="tab" data-act="section" data-v="personal">Личное</button>
      </div>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabs" aria-label="Вкладки">
      <button type="button" data-act="tab" data-v="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Добавить</span>
      </button>
      <button type="button" data-act="tab" data-v="history">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>История</span>
      </button>
      <button type="button" data-act="tab" data-v="charts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Графики</span>
      </button>
      <button type="button" data-act="tab" data-v="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg><span>Настройки</span>
      </button>
    </nav>
  </div>

  <!-- Нижняя панель (детали записи, подтверждения) -->
  <div id="sheet" class="sheet-wrap" hidden>
    <div class="sheet-backdrop" data-act="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
